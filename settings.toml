config_version = 15

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.75
    enabled = true
    margin_edge = 1
    margin_ends = 1500
    position = "bottom"
    reserve_space = false
    scale = 1.3
    smart_auto_hide = true
    start = [ "workspaces" ]
    thickness = 48
    widget_spacing = 16

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 25

[control_center]
width = 1200

[dock]
background_opacity = 0.25
border_width = 1.0
concave_edge_corners = false
enabled = true
item_spacing = 4
launcher_icon = "bat"
launcher_position = "start"
magnification_scale = 1.25
main_axis_padding = 8
margin_edge = 4
position = "top"
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    locked_timeout = 30.0
    timeout = 200.0

[location]
auto_locate = true

[lockscreen]
grace_period_seconds = 30

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_night = 3500

[shell]
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.launcher]
    show_app_actions = true
    width = 1100

[theme]
builtin = "Dracula"

[wallpaper]
directory = "/home/kylex/Desktop"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/kylex/Desktop/hd.png"

    [wallpaper.last]
    path = "/home/kylex/Desktop/hd.png"

    [wallpaper.monitors.DP-1]
    path = "/home/kylex/Desktop/hd.png"

[weather]
refresh_minutes = 10